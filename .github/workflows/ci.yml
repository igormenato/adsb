name: CI

on:
  push:
    branches: [trck-v2]
  pull_request:
    branches: [trck-v2]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
