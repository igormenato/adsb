name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: make -C esp32/host test

  pio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run -d esp32/pio

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha,scope=trck-test
          cache-to: type=gha,mode=max,scope=trck-test
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: pio
          cache-from: type=gha,scope=trck-pio
          cache-to: type=gha,mode=max,scope=trck-pio

