name: CI

on:
  push:
    branches: [trck-v2]
  pull_request:
    branches: [trck-v2]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Install Zig for musl C
        run: sh ci/install-zig-musl-cc.sh
      - run: cargo build --release --locked --target arm-unknown-linux-musleabihf
      - run: cargo build --release --locked --target aarch64-unknown-linux-musl
