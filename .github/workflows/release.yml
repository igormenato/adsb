name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked
      - name: Install Raspberry Pi ARMv6 linker and sysroot
        run: |
          sudo mkdir -p /opt/rpi-armv6/bin
          curl -fsSL https://github.com/tttapa/toolchains/releases/download/1.4.0/x-tools-armv6-rpi-linux-gnueabihf-gcc14.tar.xz \
            | sudo tar -xJ -C /opt/rpi-armv6 --strip-components=1
          sudo ln -sfn /opt/rpi-armv6/armv6-rpi-linux-gnueabihf/bin/armv6-rpi-linux-gnueabihf-gcc /opt/rpi-armv6/bin/arm-linux-gnueabihf-gcc
      - run: cargo build --locked --release --target arm-unknown-linux-gnueabihf
      - run: cp target/arm-unknown-linux-gnueabihf/release/trck trck-pi-zero-w
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ inputs.tag }}"
          trck-pi-zero-w
          --title "${{ inputs.tag }}"
          --generate-notes
          --target "${{ github.sha }}"
