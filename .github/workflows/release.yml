name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: arm-unknown-linux-musleabihf
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked --target arm-unknown-linux-musleabihf
      - run: cp target/arm-unknown-linux-musleabihf/release/trck trck-pi-zero-w
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ inputs.tag }}"
          trck-pi-zero-w
          --title "${{ inputs.tag }}"
          --generate-notes
          --target "${{ github.sha }}"
