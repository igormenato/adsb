name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CARGO_ZIGBUILD_VERSION: "0.24.1"
      ZIG_VERSION: "0.17.1"
    steps:
      - uses: actions/checkout@v7
      - run: grep -q "^version = \"${TAG#v}\"" Cargo.toml
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/cache@v4
        id: cargo-zigbuild
        with:
          path: ~/.cargo/bin/cargo-zigbuild
          key: cargo-zigbuild-${{ env.CARGO_ZIGBUILD_VERSION }}-${{ runner.os }}
      - if: steps.cargo-zigbuild.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-zigbuild --version ${{ env.CARGO_ZIGBUILD_VERSION }}
      - run: cargo zigbuild --release --locked --target arm-unknown-linux-musleabihf
      - run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl
      - run: |
          cp target/arm-unknown-linux-musleabihf/release/trck trck-arm
          cp target/aarch64-unknown-linux-musl/release/trck trck-aarch64
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${TAG}"
          trck-arm
          trck-aarch64
          --title "${TAG}"
          --generate-notes
          --target "${{ github.sha }}"
