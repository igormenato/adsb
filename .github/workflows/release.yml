name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      - run: cargo build --release --locked --target arm-unknown-linux-musleabihf
      - run: cargo build --release --locked --target aarch64-unknown-linux-musl
      - run: |
          cp target/arm-unknown-linux-musleabihf/release/trck trck-arm
          cp target/aarch64-unknown-linux-musl/release/trck trck-aarch64
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ inputs.tag }}"
          trck-arm
          trck-aarch64
          --title "${{ inputs.tag }}"
          --generate-notes
          --target "${{ github.sha }}"
