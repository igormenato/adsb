name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked
      - name: Install ARMv6 hard-float linker
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - run: cargo build --locked --release --target arm-unknown-linux-gnueabihf
      - run: cp target/arm-unknown-linux-gnueabihf/release/trck trck-pi-zero-w
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ inputs.tag }}"
          trck-pi-zero-w
          --title "${{ inputs.tag }}"
          --generate-notes
          --target "${{ github.sha }}"
