[package]
name = "adsb-uart-sender"
version = "0.1.0"
edition = "2021"
description = "Forward readsb Beast output to a UART as raw Beast or packed structs."

[[bin]]
name = "adsb-uart-sender"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc = "3.2"
ctrlc = "3.4"
rs1090 = { version = "0.7", default-features = false }
serialport = { version = "4.6", default-features = false }
