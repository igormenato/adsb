[package]
name = "trck"
version = "0.6.1"
edition = "2024"
description = "Send each decoded ADS-B position to a UART as it arrives."
publish = false

[[bin]]
name = "trck"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
crc = "3.2"
csv = "1"
ctrlc = "3.4"
hex = "0.4.3"
nix = { version = "0.31", features = ["poll", "net", "fs", "user", "term"] }
rs1090 = "0.8.1"
rs-rtl = { path = "vendor/rs-rtl" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
toml = "0.8"

[dev-dependencies]
nix = { version = "0.31", features = ["ioctl"] }
num-complex = "0.4"

[patch.crates-io]
rs-rtl = { path = "vendor/rs-rtl" }

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
strip = true
