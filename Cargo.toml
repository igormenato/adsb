[package]
name = "trck"
version = "0.1.0"
edition = "2024"
description = "Send each readsb position to a UART as it arrives."

[[bin]]
name = "trck"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc = "3.2"
ctrlc = "3.4"
libc = "0.2"
serde_json = "1"
serialport = { version = "4.6", default-features = false }
