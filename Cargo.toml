[package]
name = "trck"
version = "0.3.0"
edition = "2024"
description = "Send each decoded ADS-B position to a UART as it arrives."

[[bin]]
name = "trck"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crc = "3.2"
ctrlc = "3.4"
desperado = { version = "0.5.2", features = ["rtlsdr"] }
futures-util = "0.3.34"
libc = "0.2"
num-complex = "0.4"
rs1090 = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.6", default-features = false }
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "net"] }
toml = "0.8"

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
