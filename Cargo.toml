[package]
name = "adsb-uart-sender"
version = "0.1.0"
edition = "2021"
description = "Send readsb aircraft tracks to a UART once a second."

[[bin]]
name = "adsb-uart-sender"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc = "3.2"
ctrlc = "3.4"
libc = "0.2"
serde_json = "1"
serialport = { version = "4.6", default-features = false }
