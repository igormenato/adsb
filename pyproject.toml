[project]
name = "adsb"
version = "0.1.0"
description = "Send readsb Beast or struct records over the Pi UART"
requires-python = ">=3.11"
dependencies = [
    "pyModeS>=3",
    "pyserial",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
src = ["pi", "test"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]

[tool.ty.src]
include = ["pi", "test"]

[tool.ty.environment]
extra-paths = ["pi"]
